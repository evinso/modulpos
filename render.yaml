services:
  # ── Backend API ──
  - type: web
    name: entegrasyon-server
    runtime: node
    region: ohio
    rootDir: server
    plan: free
    buildCommand: npm install && npx prisma generate
    startCommand: npx prisma db push && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL   # Supabase pooler (6543) + ?pgbouncer=true
        sync: false
      - key: DIRECT_URL     # Supabase direct/session (5432), migrasyon için
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: https://modulpos.com,https://www.modulpos.com,https://entegrasyon-client.onrender.com
      - key: TRENDYOL_BASE_URL
        value: https://apigw.trendyol.com/integration
      - key: TRENDYOL_STAGE_URL
        value: https://stageapi.trendyol.com/stagesapigw

  # ── Frontend Static Site ──
  - type: web
    name: entegrasyon-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://api.modulpos.com/api

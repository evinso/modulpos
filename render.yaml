services:
  # ── Backend API ──
  - type: web
    name: modulpos-api
    runtime: node
    region: singapore
    rootDir: server
    plan: free
    buildCommand: npm install && npx prisma generate
    startCommand: (npx prisma db push --skip-generate || echo "[warn] prisma db push failed - starting with the existing schema") && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL   # Supabase pooler (6543) + ?pgbouncer=true
        sync: false
      - key: DIRECT_URL     # Supabase direct/session (5432), migrasyon için
        sync: false
      - key: JWT_SECRET
        generateValue: true
      - key: ADMIN_EMAIL
        sync: false
      - key: ENCRYPTION_KEY   # 64 hex chars; losing it makes stored marketplace credentials unrecoverable
        sync: false
      - key: ENCRYPTION_KEY_PREVIOUS   # only during a key rotation, see server/scripts/rotateEncryptionKey.js
        sync: false
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: https://modulpos.com,https://www.modulpos.com,https://entegrasyon-client.onrender.com
      - key: TRENDYOL_BASE_URL
        value: https://apigw.trendyol.com/integration
      - key: TRENDYOL_STAGE_URL
        value: https://stageapi.trendyol.com/stagesapigw

  # ── Frontend Static Site ──
  - type: web
    name: entegrasyon-client
    runtime: static
    rootDir: client
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
      - path: /*
        name: Referrer-Policy
        value: strict-origin-when-cross-origin
      - path: /*
        name: Permissions-Policy
        value: camera=(), microphone=(), geolocation=()
      - path: /*
        name: Content-Security-Policy
        value: "default-src 'self'; script-src 'self'; style-src 'self' 'unsafe-inline' https://fonts.googleapis.com; font-src 'self' data: https://fonts.gstatic.com; img-src 'self' data: blob: https:; connect-src 'self' https://api.modulpos.com; frame-src https://www.paytr.com; object-src 'none'; base-uri 'self'; frame-ancestors 'none'"
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://api.modulpos.com/api

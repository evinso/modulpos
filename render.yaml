databases:
  - name: entegrasyon-db
    plan: free
    databaseName: entegrasyon
    user: entegrasyon_user

services:
  # ── Backend API ──
  - type: web
    name: entegrasyon-server
    runtime: node
    rootDir: server
    plan: free
    buildCommand: npm install && npx prisma generate
    startCommand: npx prisma migrate deploy && npm start
    healthCheckPath: /api/health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 3001
      - key: DATABASE_URL
        fromDatabase:
          name: entegrasyon-db
          property: connectionString
      - key: JWT_SECRET
        generateValue: true
      - key: JWT_EXPIRES_IN
        value: 7d
      - key: CORS_ORIGIN
        value: https://modulpos.com,https://www.modulpos.com
      - key: TRENDYOL_BASE_URL
        value: https://api.trendyol.com/sapigw
      - key: TRENDYOL_STAGE_URL
        value: https://stageapi.trendyol.com/stagesapigw

  # ── Frontend Static Site ──
  - type: web
    name: entegrasyon-client
    runtime: static
    rootDir: client
    plan: free
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    headers:
      - path: /*
        name: X-Frame-Options
        value: DENY
      - path: /*
        name: X-Content-Type-Options
        value: nosniff
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
    envVars:
      - key: VITE_API_BASE_URL
        value: https://api.modulpos.com/api

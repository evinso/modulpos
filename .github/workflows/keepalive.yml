# Render's free plan puts a service to sleep after ~15 minutes without traffic, and the
# in-process cron jobs (XML sync, order sync, questions) do not run while it sleeps.
# This pings the API every 10 minutes (GitHub-hosted, free for public repositories).
name: keepalive
on:
  schedule:
    - cron: '*/10 * * * *'
  workflow_dispatch:
jobs:
  ping:
    runs-on: ubuntu-latest
    steps:
      - name: Ping API
        run: curl -fsS --retry 3 --retry-delay 10 --max-time 60 https://api.modulpos.com/api/health
